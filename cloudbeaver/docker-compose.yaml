# CloudBeaver : 브라우저에서 쓰는 웹 기반 데이터베이스 관리 도구.
# PostgreSQL, MySQL, SQLite 등에 접속해 SQL 편집기와 데이터 조회를 제공한다.
# 접속 후 최초 1회 관리자 계정을 웹 화면에서 직접 만든다.

services:
  # CloudBeaver 웹 서버
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      # 워크스페이스에 설정, 관리자 계정, 등록한 DB 접속 정보가 모두 저장된다
      - ./data:/opt/cloudbeaver/workspace
    environment:
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  default:
    name: cloudbeaver
