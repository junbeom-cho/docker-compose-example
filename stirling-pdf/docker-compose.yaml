# Stirling-PDF - 웹 기반 PDF 도구 모음
# 병합/분할/변환/압축/OCR 등 PDF 작업을 브라우저에서 처리한다.
# 파일은 서버에 보관하지 않고 처리 후 바로 반환한다.
# 접속: http://localhost:8080

services:
  # Stirling-PDF 본체 (내부 기본 포트 8080)
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # OCR 학습 데이터(.traineddata) - 언어 추가 시 이 폴더에 넣는다
      - ./data/tessdata:/usr/share/tessdata
      # 설정 파일과 내장 DB
      - ./data/configs:/configs
      - ./data/logs:/logs
      # 파이프라인(작업 자동화) 정의
      - ./data/pipeline:/pipeline
    environment:
      # 로그인 인증 비활성화 (true 로 두면 기본 계정 admin / stirling)
      SECURITY_ENABLELOGIN: "false"
      # 기본 UI 언어
      SYSTEM_DEFAULTLOCALE: ko-KR
    networks:
      - default
    deploy:
      resources:
        limits:
          # OCR 같은 무거운 작업을 자주 돌리면 이 값을 올린다
          cpus: "2.0"
          memory: 4G

networks:
  default:
    name: stirling-pdf
