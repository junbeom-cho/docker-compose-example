# IT-Tools - 개발자용 웹 유틸리티 모음 (해시, 인코딩, JSON 포맷, UUID 생성 등)
# 모든 기능이 브라우저에서 실행되는 정적 웹앱이라 DB나 저장 볼륨이 필요 없다.
# 접속: http://localhost:8080

services:
  # IT-Tools 본체 (nginx-unprivileged 기반, 내부 기본 포트 8080)
  it-tools:
    image: ghcr.io/sharevb/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # nginx 로그 타임스탬프용 시간대
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  default:
    name: it-tools
