# Dozzle - Docker 컨테이너 로그 실시간 뷰어
# 도커 소켓을 읽어 호스트의 모든 컨테이너 로그를 웹에서 실시간으로 확인한다.
# 접속: http://localhost:8080

services:
  # 로그 뷰어 본체 (내부 기본 포트 8080)
  dozzle:
    image: ghcr.io/amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 도커 소켓 - 로그를 읽기만 하므로 읽기 전용(ro)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 알림/설정 저장용
      - ./data:/data
    environment:
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  default:
    name: dozzle
