# Homepage : 셀프호스팅 서비스 링크와 상태를 한 화면에 모아주는 대시보드.
# 첫 실행 시 ./config 아래에 기본 설정 파일(services.yaml 등)이 자동 생성되며,
# 그 파일들을 편집해 대시보드를 구성한다. docker.sock 을 읽기 전용으로 붙여
# 실행 중인 컨테이너 상태도 함께 표시할 수 있다.

services:
  # 대시보드 본체 (웹 UI)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 대시보드 설정 파일 (비어 있으면 기본 설정이 생성됨)
      - ./config:/app/config
      # 컨테이너 목록/상태 조회용 (읽기 전용)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Seoul
      # 컨테이너 프로세스 실행 UID/GID
      PUID: 1000
      PGID: 1000
      # 접근 허용 Host 헤더 (필수). "*"는 모든 호스트 허용
      HOMEPAGE_ALLOWED_HOSTS: "*"
      NODE_ENV: production
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  default:
    name: homepage
