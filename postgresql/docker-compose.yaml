# PostgreSQL — 여러 앱이 함께 쓰는 공용 관계형 데이터베이스 서버.
# 5432 포트로 접속하고, 데이터는 ./data 아래에 저장된다.
# 첫 기동 시 POSTGRES_PASSWORD 로 postgres 슈퍼유저가 만들어진다.
services:
  # PostgreSQL 서버 본체.
  postgresql:
    image: postgres:17
    container_name: postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # 슈퍼유저 이름과 기본 DB 이름 (첫 기동 때만 반영된다)
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # 슈퍼유저 비밀번호 (첫 기동 때만 반영된다)
      POSTGRES_PASSWORD: ${PG_ROOT_PASSWORD}
      TZ: Asia/Seoul
      # DB 기본 로케일
      LANG: en_US.utf8
    volumes:
      - ./data:/var/lib/postgresql/data
    # 공유 메모리. 기본 64MB 로는 병렬 쿼리/정렬에서 부족할 수 있다
    shm_size: 256mb
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  default:
    name: postgresql
