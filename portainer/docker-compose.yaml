services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ee:lts
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443

volumes:
  portainer_data:
    name: portainer_data