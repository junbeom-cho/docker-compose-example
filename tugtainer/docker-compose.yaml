# Tugtainer : 도커 컨테이너 자동 업데이트 관리 웹 UI
# 실행 중인 컨테이너의 새 이미지를 감지해 알림을 주거나 자동으로 갱신한다.
# 도커 API 는 socket-proxy 를 거쳐 필요한 권한만 노출한다.
# 접속: http://localhost

services:
  # 도커 소켓을 제한된 API 로만 중계하는 프록시 (내부 통신 전용, 포트 미노출)
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: tugtainer-socket-proxy
    restart: unless-stopped
    # 프록시 자체는 파일을 쓸 필요가 없어 읽기 전용으로 띄운다
    read_only: true
    tmpfs:
      - /run
    volumes:
      # 도커 소켓 - 읽기 전용(ro)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # 1 = 해당 도커 API 그룹 허용, 미설정 = 차단
      CONTAINERS: 1
      EVENTS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      # 쓰기(POST) 요청 허용 - 이미지 갱신/재생성에 필요
      POST: 1
      # 컨테이너 조작(start/stop/restart/pause/unpause) 허용
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_PAUSE: 1
      ALLOW_UNPAUSE: 1
      # 로그 조회 기능 허용
      ALLOW_LOGS: 1
      LOG_LEVEL: warning
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Tugtainer 웹 UI 본체 (내부 기본 포트 80)
  app:
    image: ghcr.io/quenary/tugtainer:1
    container_name: tugtainer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # DB(sqlite)와 설정 저장 경로
      - ./data:/tugtainer
    environment:
      # 도커 소켓 대신 socket-proxy 를 바라보게 한다
      DOCKER_HOST: tcp://socket-proxy:2375
      # 백엔드-에이전트 간 요청 서명용 공유 비밀키 (필수)
      # 이 값은 웹 UI 의 Hosts 에서 로컬 호스트에도 동일하게 입력해야 동작한다
      AGENT_SECRET: ${AGENT_SECRET}
      TZ: Asia/Seoul
    depends_on:
      - socket-proxy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

networks:
  default:
    name: tugtainer
