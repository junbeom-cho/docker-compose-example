# Mealie : 셀프호스팅 레시피/식단 관리 서비스
# 웹에서 레시피를 스크랩해 저장하고, 주간 식단표와 장보기 목록을 만든다.
# 데이터는 PostgreSQL 에 저장하며, 첫 로그인 계정은 changeme@example.com / MyPassword 이다.

services:
  # Mealie 본체 (웹 UI + API)
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./data/mealie:/app/data/
    environment:
      # 컨테이너 내부 표준 시간대
      TZ: Asia/Seoul
      # 외부 접근 기준 URL (리버스 프록시 뒤에 둘 때만 실제 도메인으로 바꾼다)
      BASE_URL: http://localhost:9000
      # 자체 회원가입 허용 여부
      ALLOW_SIGNUP: "false"
      # 데이터베이스 엔진 (sqlite / postgres)
      DB_ENGINE: postgres
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_DB: mealie
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Mealie 전용 PostgreSQL (외부 노출 없이 내부 통신만)
  postgres:
    image: postgres:17
    container_name: mealie-postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_POSTGRES_PASSWORD}
      POSTGRES_DB: mealie
    # mealie 가 DB 준비 완료를 기다리기 위해 필요
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  default:
    name: mealie
