# Syncthing - 여러 기기 사이의 파일을 P2P 로 동기화하는 서비스
# 중앙 서버 없이 기기끼리 직접 연결되며, 웹 UI 에서 동기화할 폴더와 상대 기기를 등록한다.
# ./sync 폴더가 동기화 대상이고, ./config 에 기기 ID 와 설정이 저장된다.
# 접속: http://localhost:8384

services:
  # Syncthing 본체 (웹 UI 8384, 동기화 22000, 디스커버리 21027)
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.0.15
    container_name: syncthing
    restart: unless-stopped
    ports:
      - "8384:8384"
      # 기기 간 데이터 전송 포트 (TCP + QUIC)
      - "22000:22000/tcp"
      - "22000:22000/udp"
      # 같은 네트워크의 기기를 자동 검색하는 브로드캐스트 포트
      - "21027:21027/udp"
    volumes:
      - ./config:/config
      # 동기화할 폴더 - 웹 UI 에서 /sync 경로로 등록한다
      - ./sync:/sync
    environment:
      # 컨테이너 프로세스 실행 사용자 UID
      PUID: 1000
      # 컨테이너 프로세스 실행 그룹 GID
      PGID: 1000
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  default:
    name: syncthing
