# File Browser: 브라우저에서 파일을 올리고 내리고 편집하는 웹 파일 탐색기.
# ./data/srv 아래에 둔 파일이 웹 UI 에 노출된다.
# 최초 실행 시 admin 계정의 임의 비밀번호가 로그에 찍힌다: docker compose logs filebrowser

services:
  # 웹 파일 탐색기 본체
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    # 이미지 기본 사용자가 uid 1000 이라, 도커가 root 로 새로 만든 바인드 폴더에 쓰지 못한다
    user: "0:0"
    ports:
      - "80:80"
    volumes:
      # 사용자/설정 DB (filebrowser.db)
      - ./data/database:/database
      # settings.json - 비어 있으면 컨테이너가 기본값으로 만들어준다
      - ./data/config:/config
      # 웹에서 탐색할 실제 파일 저장소
      - ./data/srv:/srv
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - default

networks:
  default:
    name: filebrowser
