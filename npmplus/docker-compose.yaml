# NPMplus : nginx-proxy-manager 포크. 리버스 프록시 + Let's Encrypt 인증서 자동 발급.
# 80/443 으로 트래픽을 받고, 관리 UI 는 https://localhost:81 (HTTP 아님, HTTPS).
# 최초 계정은 admin@example.org 이며 랜덤 비밀번호가 로그에 찍힌다: docker compose logs npmplus
# CrowdSec 은 nginx 접근 로그를 분석해 공격 IP 를 탐지한다.

services:
  # 리버스 프록시 본체 (관리 UI 포함)
  npmplus:
    image: docker.io/zoeyvid/npmplus:latest
    container_name: npmplus
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      # HTTP/3(QUIC)용 UDP
      - "443:443/udp"
      # 관리 UI. 외부에 열지 말 것
      - "81:81/tcp"
    volumes:
      # 설정 DB, 발급받은 인증서, nginx 로그가 전부 여기에 쌓인다
      - ./data:/data
    environment:
      TZ: Asia/Seoul
      # 접근 로그를 /data/nginx/logs 에 파일로 남긴다 (CrowdSec 분석에 필수)
      LOGROTATE: "true"
      # nginx 의 IPv6 리스닝/리졸버를 끈다. IPv6 없는 도커 브리지 기본값에 맞춤
      DISABLE_IPV6: "true"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # CrowdSec : nginx 로그 기반 침입 탐지.
  # 기동만으로 차단되지는 않는다. 실제 차단은 컨테이너 안에서 acquis.d 설정 추가 +
  # `docker exec npmplus_crowdsec cscli bouncers add npmplus` 로 발급한 키를 NPMplus UI 에 넣어야 한다.
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: npmplus_crowdsec
    restart: unless-stopped
    volumes:
      # 최초 실행 시 이미지 기본 설정이 자동으로 채워진다
      - ./crowdsec/conf:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      # npmplus 가 남긴 접근 로그를 읽기 전용으로 공유 (컨테이너 내부 경로는 업스트림 기준 고정)
      - ./data/nginx/logs:/opt/npmplus/nginx/logs:ro
    environment:
      TZ: Asia/Seoul
      # NPMplus 전용 파서/시나리오 모음
      COLLECTIONS: ZoeyVid/npmplus
    depends_on:
      - npmplus
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  default:
    name: npmplus
