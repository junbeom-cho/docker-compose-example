services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ${DATA_DIR}/conf:/etc/caddy:ro
      - ${DATA_DIR}/site:/srv:ro
      - ${DATA_DIR}/data:/data
      - ${DATA_DIR}/config:/config
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - default

networks:
  default:
    name: caddy-network