# Uptime Kuma : 서비스 상태 모니터링 대시보드
# HTTP/TCP/Ping 등으로 서비스 가동 여부를 주기적으로 체크하고, 장애 시 알림을 보낸다.
# 모니터 설정과 이력 DB 는 ./data 에 쌓인다.
# 첫 접속(http://localhost:3001)에서 관리자 계정을 직접 만든다.

services:
  # Uptime Kuma 본체 (내부 기본 포트 3001)
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # 모니터 설정, 상태 이력 DB, 업로드 파일
      - ./data:/app/data
    environment:
      TZ: Asia/Seoul
      # 컨테이너가 생성하는 파일의 권한 마스크
      UMASK: "0022"
      NODE_ENV: production
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  default:
    name: uptime-kuma
