# Vaultwarden : Bitwarden 호환 비밀번호 관리자 (Rust 구현 경량 서버)
# 웹 볼트 UI 와 Bitwarden 공식 클라이언트(브라우저 확장/모바일 앱) 를 그대로 사용할 수 있다.
# 데이터는 컨테이너 안 SQLite 에 저장되므로 별도 DB 서비스가 필요 없다.
# 접속: http://localhost (관리자 페이지는 http://localhost/admin)

services:
  # Vaultwarden 본체 (컨테이너 내부 기본 포트 80)
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # SQLite DB, 첨부파일, RSA 키가 모두 여기에 저장된다
      - ./data:/data
    environment:
      TZ: Asia/Seoul
      # 클라이언트에게 안내되는 접속 주소 - 외부 서비스 시 실제 도메인으로 바꾸세요
      DOMAIN: http://localhost
      # 관리자 페이지(/admin) 접근 토큰 - 비우면 관리자 페이지가 비활성화된다
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # 신규 회원가입 허용 - 첫 계정을 만든 뒤 false 로 바꾸는 것을 권장
      SIGNUPS_ALLOWED: "true"
      # 가입 시 이메일 인증 요구 - 아래 SMTP 를 실제 값으로 채운 뒤 true 로 바꾸세요
      SIGNUPS_VERIFY: "false"
      # 로그인 화면에 비밀번호 힌트를 노출하지 않는다
      SHOW_PASSWORD_HINT: "false"
      # 메일 발송 설정 - 실제 SMTP 서버 값으로 바꾸세요 (미설정이어도 컨테이너는 정상 기동)
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_FROM: vault@example.com
      SMTP_FROM_NAME: My Vault
      SMTP_USERNAME: CHANGE_ME
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # SSO(OIDC) 로그인 - 별도 인증 서버(Authentik/Keycloak 등)가 필요해 예제에서는 끈다
      SSO_ENABLED: "false"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  default:
    name: vaultwarden
