# Dockge : Docker Compose 스택을 웹 UI에서 관리하는 도구
# 컨테이너/스택 생성, 편집, 로그 확인, 시작/중지를 브라우저에서 처리한다.
# 접속: http://localhost:5001

services:
  # Dockge 웹 UI 본체
  dockge:
    image: louislam/dockge:1.5.0
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # 호스트 도커 데몬 제어용 소켓
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Dockge가 관리할 스택(compose 파일) 디렉터리
      - ./stacks:/opt/stacks
    environment:
      # 스택 디렉터리의 컨테이너 내부 경로 (위 마운트의 우측과 동일해야 함)
      DOCKGE_STACKS_DIR: /opt/stacks
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

networks:
  default:
    name: dockge
