# Scrutiny - 디스크 S.M.A.R.T / NVMe 건강 상태 모니터링
# omnibus 이미지 하나에 웹 UI + InfluxDB + 수집기(collector)가 모두 들어있다.
# 접속: http://localhost:8080

services:
  # Scrutiny 본체 (내부 기본 포트 8080)
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    # smartctl 이 호스트 디스크를 직접 읽으려면 필요 (SYS_RAWIO/SYS_ADMIN + apparmor 해제를 한 번에 대체)
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      # 디스크 목록을 찾기 위한 호스트 장치 정보 (읽기 전용)
      - /run/udev:/run/udev:ro
      - /dev:/dev:ro
      # 설정 파일
      - ./config:/opt/scrutiny/config
      # 수집한 S.M.A.R.T 이력이 쌓이는 InfluxDB 데이터
      - ./influxdb:/opt/scrutiny/influxdb
    environment:
      TZ: Asia/Seoul
    # 특정 디스크만 감시하고 싶으면 아래를 주석 해제하고 본인 호스트의 장치명으로 바꾼다.
    # 장치명은 호스트마다 다르므로(없는 장치를 쓰면 컨테이너가 안 뜬다) 기본값은 비워둔다.
    # devices:
    #   - "/dev/sda:/dev/sda"
    #   - "/dev/nvme0n1:/dev/nvme0n1"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  default:
    name: scrutiny
