# Kopia : 백업/스냅샷 관리 서버
# 웹 UI(http://localhost:51515)에서 저장소를 만들고 스냅샷을 관리한다.
# ./backup-source 에 백업할 대상을, ./data/repository 에 로컬 저장소가 생성된다.

services:
  # Kopia 서버 (웹 UI + 백업 엔진)
  kopia:
    image: kopia/kopia:latest
    container_name: kopia
    # 스냅샷에 기록되는 호스트 이름
    hostname: kopia-server
    restart: unless-stopped
    ports:
      - "51515:51515"
    command:
      - server
      - start
      # 로컬 예제용: CSRF 검사와 TLS 없이 HTTP 로 접속
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      # 웹 UI 로그인 계정
      - --server-username=kopia
      - --server-password=${KOPIA_ADMIN_PASSWORD}
    volumes:
      # 저장소 접속 설정 파일
      - ./data/config:/app/config
      # 다운로드 데이터 캐시
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
      # 로컬 파일시스템 저장소를 만들 위치
      - ./data/repository:/repository
      # 백업할 원본 폴더 예시 (읽기 전용)
      - ./backup-source:/data/backup-source:ro
    environment:
      # Kopia 저장소 암호
      KOPIA_PASSWORD: ${KOPIA_REPOSITORY_PASSWORD}
      # 컨테이너 내부 기본 사용자명 (스냅샷 소유자 표기에 사용)
      USER: kopia
      TZ: Asia/Seoul
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  default:
    name: kopia
